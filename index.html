<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇲🇴 澳門超市街坊格價通（公益測試版）</title>
    <!-- 引入手機鏡頭掃碼庫 -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f9fa;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container { max-width: 600px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 22px; color: #2c3e50; margin-bottom: 5px; }
        .subtitle { font-size: 13px; color: #e67e22; background: #fef5e7; padding: 5px 10px; border-radius: 4px; display: inline-block; }
        
        .action-box { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; margin-bottom: 10px; }
        
        .scan-btn {
            background-color: #3498db;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .scan-btn:active { background-color: #2980b9; }

        .close-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            display: none; /* 預設隱藏，開相機時才顯示 */
        }
        .close-btn:active { background-color: #c0392b; }
        
        #reader { width: 100%; margin-top: 15px; display: none; border-radius: 8px; overflow: hidden; }
        
        .card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .card h3 { margin-top: 0; font-size: 18px; color: #333; }
        .barcode-tag { font-size: 12px; color: #999; margin-bottom: 8px; }
        .price-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f1f1f1; font-size: 14px; }
        .price-row:last-child { border-bottom: none; }
        .cheapest { color: #e74c3c; font-weight: bold; }
        .loading { text-align: center; color: #999; padding: 20px; }
        
        footer { text-align: center; font-size: 12px; color: #7f8c8d; margin-top: 30px; padding: 10px; border-top: 1px solid #eee; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🇲🇴 澳門超市街坊格價通</h1>
        <div class="subtitle">🌱 純公益無廣告・幫街坊精明買餸</div>
    </header>

    <!-- 搜尋與掃碼區 -->
    <div class="action-box">
        <input type="text" id="searchInput" placeholder="🔍 輸入商品名稱或 Barcode..." onkeyup="filterProducts()">
        <button class="scan-btn" onclick="startScanner()">📷 點擊開啟鏡頭掃描 Barcode</button>
        
        <!-- 鏡頭預覽視窗 -->
        <div id="reader"></div>
        <!-- 關閉相機按鈕 -->
        <button id="closeScanBtn" class="close-btn" onclick="stopScanner()">❌ 關閉相機</button>
    </div>

    <!-- 商品列表 -->
    <div id="productList">
        <div class="loading">⏳ 正在加載數據...</div>
    </div>

    <footer>
        <p>📊 本網頁之物價數據源自澳門特別行政區政府消費者委員會。</p>
        <p>本工具僅供市民日常格價參考，屬非商業性公益用途。</p>
    </footer>
</div>

<script>
    let allProducts = [];
    let html5QrCode = null;

    // 1. 讀取數據
    async function fetchPrices() {
        try {
            let response = await fetch('./prices.json');
            allProducts = await response.json();
            renderProducts(allProducts);
        } catch (error) {
            document.getElementById('productList').innerHTML = '<div class="loading">❌ 數據載入失敗</div>';
        }
    }

    // 2. 渲染列表
    function renderProducts(products) {
        let container = document.getElementById('productList');
        if (products.length === 0) {
            container.innerHTML = '<div class="loading">🔍 找不到相關商品</div>';
            return;
        }

        let html = '';
        products.forEach(item => {
            html += `
                <div class="card">
                    <h3>🔥 ${item.name}</h3>
                    <div class="barcode-tag">條形碼: ${item.barcode}</div>
            `;
            item.prices.forEach(p => {
                let priceClass = p.is_cheapest ? 'cheapest' : '';
                let label = p.is_cheapest ? ' (最平)' : '';
                html += `
                    <div class="price-row">
                        <span>${p.shop}</span>
                        <span class="${priceClass}">$${p.price.toFixed(1)} MOP${label}</span>
                    </div>
                `;
            });
            html += `</div>`;
        });
        container.innerHTML = html;
    }

    // 3. 關鍵字篩選
    function filterProducts() {
        let query = document.getElementById('searchInput').value.toLowerCase().trim();
        let filtered = allProducts.filter(item => 
            item.name.toLowerCase().includes(query) || item.barcode.includes(query)
        );
        renderProducts(filtered);
    }

    // 4. 啟動鏡頭掃碼
    function startScanner() {
        let readerDiv = document.getElementById('reader');
        readerDiv.style.display = "block";
        document.getElementById('closeScanBtn').style.display = "block"; // 顯示關閉按鈕

        if (!html5QrCode) {
            html5QrCode = new Html5Qrcode("reader");
        }

        html5QrCode.start(
            { facingMode: "environment" }, // 優先使用後置鏡頭
            {
                fps: 10,
                qrbox: { width: 250, height: 100 }
            },
            (decodedText, decodedResult) => {
                // 成功掃描到 Barcode！
                alert(`成功掃描條形碼：${decodedText}`);
                
                // 填入搜尋框並過濾
                document.getElementById('searchInput').value = decodedText;
                filterProducts();

                // 自動關閉相機
                stopScanner();
            },
            (errorMessage) => {
                // 掃描中
            }
        ).catch(err => {
            alert("無法開啟相機，請檢查瀏覽器相機權限：" + err);
            document.getElementById('closeScanBtn').style.display = "none";
        });
    }

    // 5. 關閉鏡頭
    function stopScanner() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                document.getElementById('reader').style.display = "none";
                document.getElementById('closeScanBtn').style.display = "none"; // 隱藏關閉按鈕
            }).catch(err => {
                console.error("停止相機失敗", err);
                document.getElementById('reader').style.display = "none";
                document.getElementById('closeScanBtn').style.display = "none";
            });
        } else {
            document.getElementById('reader').style.display = "none";
            document.getElementById('closeScanBtn').style.display = "none";
        }
    }

    // 初始化
    fetchPrices();
</script>

</body>
</html>
