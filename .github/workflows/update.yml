name: 每日自動更新物價數據

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# 授予倉庫寫入權限，確保可以自動提交代碼
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出代碼倉庫
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 執行更新腳本
        run: |
          echo "正在從數據源獲取最新物價..."
          node update.js
          
      - name: 自動提交並推送到倉庫
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "🤖 系統自動更新每日超市物價數據" || echo "No changes to commit"
          git push
