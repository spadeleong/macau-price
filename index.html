<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇲🇴 澳門超市街坊格價通（公益測試版）</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f9fa;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container { max-width: 600px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 22px; color: #2c3e50; margin-bottom: 5px; }
        .subtitle { font-size: 13px; color: #e67e22; background: #fef5e7; padding: 5px 10px; border-radius: 4px; display: inline-block; }
        .search-box { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .card h3 { margin-top: 0; font-size: 18px; color: #333; }
        .price-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f1f1f1; font-size: 14px; }
        .price-row:last-child { border-bottom: none; }
        .cheapest { color: #e74c3c; font-weight: bold; }
        .loading { text-align: center; color: #999; padding: 20px; }
        footer { text-align: center; font-size: 12px; color: #7f8c8d; margin-top: 30px; padding: 10px; border-top: 1px solid #eee; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🇲🇴 澳門超市街坊格價通</h1>
        <div class="subtitle">🌱 純公益無廣告・幫街坊精明買餸</div>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 輸入想查嘅商品，例如：米、油、牛奶..." onkeyup="filterProducts()">
    </div>

    <div id="productList">
        <div class="loading">⏳ 正在加載最新數據...</div>
    </div>

    <footer>
        <p>📊 本網頁之物價數據源自澳門特別行政區政府消費者委員會[span_0](start_span)[span_0](end_span)。</p>
        <p>本工具僅供市民日常格價參考，屬非商業性公益用途[span_1](start_span)[span_1](end_span)。</p>
    </footer>
</div>

<script>
    let allProducts = [];

    // 自動讀取同目錄下的 prices.json 數據
    async function fetchPrices() {
        try {
            let response = await fetch('./prices.json');
            allProducts = await response.json();
            renderProducts(allProducts);
        } catch (error) {
            document.getElementById('productList').innerHTML = '<div class="loading">❌ 數據載入失敗，請稍後重試</div>';
        }
    }

    // 渲染商品列表
    function renderProducts(products) {
        let container = document.getElementById('productList');
        if (products.length === 0) {
            container.innerHTML = '<div class="loading">🔍 找不到相關商品</div>';
            return;
        }

        let html = '';
        products.forEach(item => {
            html += `<div class="card"><h3>🔥 ${item.name}</h3>`;
            item.prices.forEach(p => {
                let priceClass = p.is_cheapest ? 'cheapest' : '';
                let label = p.is_cheapest ? ' (最平)' : '';
                html += `
                    <div class="price-row">
                        <span>${p.shop}</span>
                        <span class="${priceClass}">$${p.price.toFixed(1)} MOP${label}</span>
                    </div>
                `;
            });
            html += `</div>`;
        });
        container.innerHTML = html;
    }

    // 前端即時搜尋篩選
    function filterProducts() {
        let query = document.getElementById('searchInput').value.toLowerCase().trim();
        let filtered = allProducts.filter(item => item.name.toLowerCase().includes(query));
        renderProducts(filtered);
    }

    // 頁面載入時執行
    fetchPrices();
</script>

</body>
</html>
