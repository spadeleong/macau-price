name: 每日自動更新物價數據

on:
  schedule:
    # 設定每日澳門時間早上 8 點自動運行
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出代碼倉庫
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝數據解析工具
        run: npm install cheerio

      - name: 執行全自動抓取腳本
        run: node update.js
          
      - name: 自動提交並推送到倉庫
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "🤖 系統全自動更新消委會最新物價數據" || echo "No changes to commit"
          git push
