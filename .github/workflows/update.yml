name: 每日自動更新物價數據

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出代碼倉庫
        uses: actions/checkout@v3

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 執行更新腳本
        run: |
          echo "正在從數據源獲取最新物價..."
          node update.js
          
      - name: 自動提交並推送到倉庫
        uses: stefanzweig/git-auto-commit-action@v4
        with:
          commit_message: "🤖 系統自動更新每日超市物價數據"
          file_pattern: prices.json
